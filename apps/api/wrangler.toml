name            = "arena-api"
main            = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT        = "local"
BETTER_AUTH_URL    = "http://localhost:8787"
PASSKEY_RP_ID      = "localhost"
PASSKEY_ORIGIN     = "http://localhost:5173"

[[kv_namespaces]]
binding = "APP_KV"
id      = "00000000000000000000000000000001"

[[d1_databases]]
binding        = "APP_DB"
database_name  = "arena-db-local"
database_id    = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"

# ── Dev environment ────────────────────────────────────────────────────────────
# After running `pnpm deploy:dev`, replace placeholders with `pulumi stack output` values.
# For passkey vars: PASSKEY_RP_ID = your Pages domain, PASSKEY_ORIGIN = https://<pages-domain>

[env.dev]
name = "arena-api-dev"

[env.dev.vars]
ENVIRONMENT     = "development"
BETTER_AUTH_URL = "https://arena-api-dev.atharv-vaish.workers.dev"
PASSKEY_RP_ID   = "arena-web-dev.pages.dev"
PASSKEY_ORIGIN  = "https://arena-web-dev.pages.dev"
# BETTER_AUTH_SECRET is set as a wrangler secret (not in vars)

[[env.dev.kv_namespaces]]
binding = "APP_KV"
id      = "f3327430ecb64d67b602ea76f90c4597"

[[env.dev.d1_databases]]
binding        = "APP_DB"
database_name  = "arena-db-dev"
database_id    = "3691a0bc-c3ce-453f-9a66-93d6aa7dbb41"
migrations_dir = "../../packages/db/migrations"

# ── Prod environment ───────────────────────────────────────────────────────────

[env.prod]
name = "arena-api-prod"

[env.prod.vars]
ENVIRONMENT     = "production"
BETTER_AUTH_URL = "https://arena-api-prod.atharv-vaish.workers.dev"
PASSKEY_RP_ID   = "arena-web-prod.pages.dev"
PASSKEY_ORIGIN  = "https://arena-web-prod.pages.dev"
# BETTER_AUTH_SECRET is set as a wrangler secret (not in vars)

[[env.prod.kv_namespaces]]
binding = "APP_KV"
id      = "da00e5d137e242df95a51d278b6fca04"

[[env.prod.d1_databases]]
binding        = "APP_DB"
database_name  = "arena-db-prod"
database_id    = "8e923a30-b356-4bd0-9de6-b615db5af292"
migrations_dir = "../../packages/db/migrations"
